[package]
name = "eh-archive"
version = "0.1.9"
edition = "2024"

[dependencies]
libeh = { git = "https://github.com/AyaseFile/EhRust" }
anyhow = "1.0.104"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
tokio = "1.53.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
diesel = { version = "2.3.13", features = ["sqlite"] }
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
diesel-dynamic-schema = "0.2.4"
chrono = "0.4.45"
regex = "1.13.1"
once_cell = "1.21.4"
zip = "8.6.0"
log = "0.4.34"
env_logger = "0.11.11"
quick-xml = "0.42.0"
tempfile = "3.27.0"